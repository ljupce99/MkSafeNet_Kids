<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Certificate</title>
  <style>
    body { font-family: 'DejaVu Sans', Arial, sans-serif; margin:0; padding:0; }
    .page { width:210mm; height:297mm; padding:40mm 20mm; box-sizing:border-box }
    .certificate { border:4px solid #2c3e50; padding:30px; text-align:center }
    .title { font-size:28px; font-weight:bold; margin-bottom:20px }
    .name { font-size:42px; font-weight:bold; color:#2c3e50; margin:30px 0 }
    .body { font-size:18px; margin-top:20px }
    .footer { margin-top:60px; font-size:14px; color:#666 }
  </style>
</head>
<body>
  <div class="page">
    <div class="certificate">
      <div class="title">Certificate of Completion</div>
      <div class="body">This certifies that</div>
      <div class="name" th:text="${name}">[NAME]</div>
      <div class="body">has successfully completed the course.</div>
      <div class="footer">Issued by Mksafenet</div>
    </div>
  </div>
</body>
</html>
